<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>나의 루틴 플래너</title>
<meta name="theme-color" content="#4a90d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="루틴플래너">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --color-text-primary: #1a202c;
    --color-text-secondary: #5a6472;
    --color-background-primary: #ffffff;
    --color-background-secondary: #f7fafc;
    --color-border-tertiary: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--color-background-primary); }
  #root { min-height: 100vh; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react" data-preset-react-options='{"runtime":"classic"}'>
const { useState, useEffect, useCallback, useRef } = React;


const todayStr = () => new Date().toISOString().slice(0,10);
const fmt = d => new Date(d).toISOString().slice(0,10);
const daysInMonth = (y,m) => new Date(y,m,0).getDate();
const DOW = ["일","월","화","수","목","금","토"];
const COLORS = ["#4a90d9","#48bb78","#ed8936","#9f7aea","#f56565","#38b2ac","#ed64a6","#667eea","#f6ad55","#68d391"];
const isSameDay = (a,b) => fmt(a)===fmt(b);

const QUOTES = [
  "작은 걸음이 모여 큰 여정이 됩니다. 오늘도 한 걸음 나아가세요.",
  "포기하지 않는 사람이 결국 이깁니다. 당신은 할 수 있어요.",
  "오늘의 노력이 내일의 당신을 만듭니다.",
  "시작이 반입니다. 이미 절반은 해낸 셈이에요!",
  "어제보다 나은 오늘, 그것으로 충분합니다.",
  "꿈을 향해 나아가는 매일이 성공입니다.",
  "힘든 길일수록 끝에 더 아름다운 풍경이 기다립니다.",
  "당신의 가능성은 무한합니다. 믿고 나아가세요.",
  "실패는 성공의 어머니, 오늘의 실수가 내일의 지혜가 됩니다.",
  "지금 이 순간이 남은 인생 중 가장 젊은 날입니다.",
  "작은 습관이 인생을 바꿉니다. 오늘도 꾸준히!",
  "당신이 선택한 오늘이 미래를 만듭니다.",
  "최선을 다한 하루는 그 자체로 빛납니다.",
  "도전하지 않으면 아무것도 바뀌지 않습니다.",
  "성장은 편안함 밖에서 시작됩니다.",
  "오늘 심은 씨앗이 내일 꽃을 피웁니다.",
  "당신은 생각보다 훨씬 강합니다.",
  "매일 1%씩 나아지면 1년 후 37배 성장합니다.",
  "결과보다 과정을 즐기는 사람이 진짜 승자입니다.",
  "지금 시작하는 것이 완벽한 준비보다 낫습니다.",
  "오늘 하루도 최선을 다해 빛내세요. 당신은 특별합니다.",
  "어떤 어려움도 당신을 멈출 수 없습니다.",
  "목표를 향해 한 발씩, 반드시 도달합니다.",
  "자신을 믿으세요. 당신은 충분히 훌륭합니다.",
  "오늘도 이렇게 살아내고 있다는 것 자체가 대단합니다.",
  "작은 성공을 축하하세요. 그게 큰 성공의 시작입니다.",
  "포기란 없습니다. 잠시 쉬어가는 것뿐입니다.",
  "당신의 노력은 반드시 빛을 발하게 됩니다.",
  "오늘 하루도 당신을 응원합니다. 파이팅!",
  "행복은 목적지가 아니라 여정 속에 있습니다.",
];

function useLS(key,init){
  const [v,setV]=useState(()=>{try{const s=localStorage.getItem(key);return s?JSON.parse(s):init;}catch{return init;}});
  useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(v));}catch{}},[key,v]);
  return [v,setV];
}

const DEFAULT_CATS=[{id:1,name:"업무",color:"#4a90d9"},{id:2,name:"건강",color:"#48bb78"},{id:3,name:"자기계발",color:"#9f7aea"},{id:4,name:"생활",color:"#ed8936"}];

const LIGHT_VARS={
  "--color-text-primary":"#1a202c",
  "--color-text-secondary":"#5a6472",
  "--color-background-primary":"#ffffff",
  "--color-background-secondary":"#f7fafc",
  "--color-border-tertiary":"#e2e8f0",
};
const DARK_VARS={
  "--color-text-primary":"#f1f5f9",
  "--color-text-secondary":"#a3b0c2",
  "--color-background-primary":"#1a202c",
  "--color-background-secondary":"#242e3d",
  "--color-border-tertiary":"#3a4658",
};

function App(){
  const [tab,setTab]=useState("today");
  const [goals,setGoals]=useLS("v4_goals",[]);
  const [events,setEvents]=useLS("v4_events",[]);
  const [routines,setRoutines]=useLS("v4_routines",[]);
  const [habits,setHabits]=useLS("v4_habits",[]);
  const [habitLogs,setHabitLogs]=useLS("v4_hlogs",{});
  const [categories,setCategories]=useLS("v4_cats",DEFAULT_CATS);
  const [mindmaps,setMindmaps]=useLS("v4_mindmaps",[]);
  const [mandalas,setMandalas]=useLS("v4_mandalas",[]);
  const [journals,setJournals]=useLS("v4_journals",[]);
  const [meditationLog,setMeditationLog]=useLS("v4_meditation_log",{});
  const [stretchLog,setStretchLog]=useLS("v4_stretch_log",{});
  const [lastBackup,setLastBackup]=useLS("v4_last_backup",null);
  const [dark,setDark]=useLS("v4_dark",false);

  useEffect(()=>{
    const root=document.documentElement;
    const vars=dark?DARK_VARS:LIGHT_VARS;
    Object.entries(vars).forEach(([k,v])=>root.style.setProperty(k,v));
  },[dark]);

  const p={goals,setGoals,events,setEvents,routines,setRoutines,habits,setHabits,habitLogs,setHabitLogs,categories,setCategories,mindmaps,setMindmaps,mandalas,setMandalas,journals,setJournals,meditationLog,setMeditationLog,stretchLog,setStretchLog,lastBackup,setLastBackup,dark,setDark};
  const TABS=[{id:"today",icon:"🏠",label:"홈"},{id:"calendar",icon:"📅",label:"캘린더"},{id:"goals",icon:"🎯",label:"목표"},{id:"habits",icon:"📊",label:"습관"},{id:"think",icon:"✏️",label:"생각정리"},{id:"me",icon:"🧘",label:"나를위한"}];
  return(
    <div style={{fontFamily:"system-ui,sans-serif",maxWidth:900,margin:"0 auto",paddingBottom:80,color:"var(--color-text-primary)",background:"var(--color-background-primary)",fontSize:15,minHeight:"100vh"}}>
      {tab==="today"&&<TodayTab {...p}/>}
      {tab==="calendar"&&<CalendarTab {...p}/>}
      {tab==="goals"&&<GoalsTab {...p}/>}
      {tab==="habits"&&<HabitsTab {...p}/>}
      {tab==="think"&&<ThinkTab {...p}/>}
      {tab==="me"&&<MeTab {...p}/>}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"var(--color-background-primary)",borderTop:"0.5px solid var(--color-border-tertiary)",display:"flex",justifyContent:"center",zIndex:100}}>
        <div style={{display:"flex",maxWidth:900,width:"100%"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} aria-label={t.label} style={{flex:1,minHeight:52,padding:"8px 0 6px",border:"none",background:"transparent",cursor:"pointer",color:tab===t.id?"#4a90d9":"var(--color-text-secondary)"}}>
              <div style={{fontSize:19}}>{t.icon}</div>
              <div style={{fontSize:11,marginTop:2,fontWeight:tab===t.id?600:400}}>{t.label}</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════
// 홈 탭
// ══════════════════════════════
function TodayTab({events,setEvents,routines,setRoutines,goals,habits,habitLogs,categories,setCategories,meditationLog,stretchLog,journals,lastBackup,setLastBackup,dark,setDark}){
  const [showRM,setShowRM]=useState(false);
  const [showEM,setShowEM]=useState(false);
  const [showCM,setShowCM]=useState(false);
  const [showBackup,setShowBackup]=useState(false);
  const [showSearch,setShowSearch]=useState(false);
  const [showReview,setShowReview]=useState(false);
  const [bannerDismissed,setBannerDismissed]=useState(false);
  const [filterCat,setFilterCat]=useState(null);
  const [clock,setClock]=useState(new Date());
  const [notifyOn,setNotifyOn]=useLS("v4_notify",false);
  const notifiedRef=useRef(new Set());
  const today=todayStr();
  const now=new Date();

  const quoteIdx = Math.floor(new Date(today).getTime()/86400000) % QUOTES.length;
  const quote = QUOTES[quoteIdx];

  const daysSinceBackup = lastBackup ? Math.floor((Date.now()-new Date(lastBackup).getTime())/86400000) : null;
  const showBackupBanner = !bannerDismissed && (daysSinceBackup===null || daysSinceBackup>=7);

  useEffect(()=>{
    const id=setInterval(()=>setClock(new Date()),1000);
    return ()=>clearInterval(id);
  },[]);

  // 알림: 탭이 열려있는 동안 오늘 일정·루틴 시간이 다가오면 브라우저 알림
  useEffect(()=>{
    if(!notifyOn)return;
    if(typeof Notification==="undefined")return;
    if(Notification.permission==="default"){Notification.requestPermission();}
    const check=()=>{
      if(Notification.permission!=="granted")return;
      const nowD=new Date();
      const nowMin=nowD.getHours()*60+nowD.getMinutes();
      events.filter(e=>e.date===todayStr()&&e.time&&!e.done).forEach(e=>{
        const[h,m]=e.time.split(":").map(Number);
        const diff=(h*60+m)-nowMin;
        const key="ev_"+e.id+"_"+todayStr();
        if(diff>=0&&diff<=10&&!notifiedRef.current.has(key)){
          notifiedRef.current.add(key);
          try{new Notification("📅 일정 알림",{body:`${e.title} · ${e.time}`});}catch{}
        }
      });
      routines.filter(r=>r.time&&r.doneDate!==todayStr()&&(r.freq==="daily"||(r.freq==="weekly"&&r.days?.includes(nowD.getDay())))).forEach(r=>{
        const[h,m]=r.time.split(":").map(Number);
        const diff=(h*60+m)-nowMin;
        const key="rt_"+r.id+"_"+todayStr();
        if(diff>=0&&diff<=10&&!notifiedRef.current.has(key)){
          notifiedRef.current.add(key);
          try{new Notification("🔄 루틴 알림",{body:`${r.title} · ${r.time}`});}catch{}
        }
      });
    };
    check();
    const id=setInterval(check,30000);
    return ()=>clearInterval(id);
  },[notifyOn,events,routines]);

  const todayRt=routines.filter(r=>{
    const ok=r.freq==="daily"||(r.freq==="weekly"&&r.days?.includes(now.getDay()));
    return ok&&(!filterCat||r.catId===filterCat);
  });
  const todayEv=events.filter(e=>e.date===today&&(!filterCat||e.catId===filterCat)).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const doneRt=todayRt.filter(r=>r.doneDate===today).length;
  const rtPct=todayRt.length?Math.round(doneRt/todayRt.length*100):0;
  const doneTodo=todayEv.filter(e=>e.done).length;
  const todayHabits=habits.filter(h=>h.freq==="daily"||(h.freq==="weekly"&&h.days?.includes(now.getDay())));
  const doneHabits=todayHabits.filter(h=>habitLogs[`${h.id}_${today}`]).length;

  const toggleRt=id=>setRoutines(p=>p.map(r=>r.id===id?{...r,doneDate:r.doneDate===today?null:today}:r));
  const toggleEv=id=>setEvents(p=>p.map(e=>e.id===id?{...e,done:!e.done}:e));

  const dateLabel=now.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});

  return(
    <div>
      <div style={{background:"linear-gradient(135deg,#4a90d9 0%,#667eea 100%)",padding:"28px 20px 22px",color:"#fff"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{fontSize:13,opacity:0.85,marginBottom:4}}>{dateLabel}</div>
          <button onClick={()=>setDark(v=>!v)} aria-label="다크모드 전환" style={{minWidth:40,minHeight:40,border:"none",background:"rgba(255,255,255,0.2)",borderRadius:"50%",color:"#fff",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{dark?"☀️":"🌙"}</button>
        </div>
        <div style={{fontSize:38,fontWeight:700,lineHeight:1.1,marginBottom:10,letterSpacing:"-1px"}}>
          {now.getHours()<12?"좋은 아침 ☀️":now.getHours()<18?"좋은 오후 🌤":"좋은 저녁 🌙"}
        </div>
        <div style={{fontSize:14,opacity:0.92,lineHeight:1.7,background:"rgba(255,255,255,0.15)",borderRadius:10,padding:"10px 14px",marginBottom:14,fontStyle:"italic"}}>
          "{quote}"
        </div>
        <div style={{display:"flex",alignItems:"baseline",gap:6,fontVariantNumeric:"tabular-nums"}}>
          <span style={{fontSize:24,fontWeight:600}}>{clock.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}</span>
        </div>
      </div>

      {showBackupBanner&&(
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 16px",background:"#fff7e6",borderBottom:"1px solid #f6ad55"}}>
          <span style={{fontSize:18}}>💾</span>
          <div style={{flex:1,fontSize:12,color:"#7b4b12",lineHeight:1.5}}>
            {daysSinceBackup===null?"아직 백업한 적이 없어요. 데이터가 사라지기 전에 백업해두세요.":`마지막 백업 후 ${daysSinceBackup}일 지났어요. 지금 백업할까요?`}
          </div>
          <button onClick={()=>setShowBackup(true)} style={{minHeight:32,padding:"5px 11px",borderRadius:8,border:"none",background:"#f59e0b",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>백업하기</button>
          <button onClick={()=>setBannerDismissed(true)} aria-label="배너 닫기" style={{minWidth:28,minHeight:28,border:"none",background:"transparent",color:"#7b4b12",fontSize:16,cursor:"pointer"}}>×</button>
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,padding:"14px 16px 6px"}}>
        <DashCard emoji="🔄" label="루틴" value={`${doneRt}/${todayRt.length}`} pct={rtPct} color="#4a90d9"/>
        <DashCard emoji="✅" label="할일" value={`${doneTodo}/${todayEv.length}`} pct={todayEv.length?Math.round(doneTodo/todayEv.length*100):0} color="#48bb78"/>
        <DashCard emoji="📊" label="습관" value={`${doneHabits}/${todayHabits.length}`} pct={todayHabits.length?Math.round(doneHabits/todayHabits.length*100):0} color="#9f7aea"/>
      </div>

      <div style={{padding:"6px 16px 16px"}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14,alignItems:"center"}}>
          <button onClick={()=>setFilterCat(null)} style={{...chip(filterCat===null,"#4a90d9")}}>전체</button>
          {categories.map(c=><button key={c.id} onClick={()=>setFilterCat(filterCat===c.id?null:c.id)} style={{...chip(filterCat===c.id,c.color)}}>{c.name}</button>)}
          <button onClick={()=>setShowCM(true)} style={{...chip(false,"#8a94a3"),fontSize:12}}>추가</button>
          <button onClick={()=>setShowSearch(true)} aria-label="검색" style={{...chip(false,"#4a5568"),marginLeft:"auto"}}>🔍</button>
          <button onClick={()=>setShowBackup(true)} style={{...chip(false,"#38b2ac")}}>💾 백업</button>
          <button onClick={()=>setNotifyOn(v=>!v)} style={{...chip(notifyOn,"#f59e0b")}}>{notifyOn?"🔔 알림 켜짐":"🔕 알림 꺼짐"}</button>
        </div>

        <Section title="📊 이번 주 리뷰" action={<SmBtn onClick={()=>setShowReview(v=>!v)}>{showReview?"접기":"펼치기"}</SmBtn>}>
          {showReview&&<WeeklyReview habits={habits} habitLogs={habitLogs} goals={goals} meditationLog={meditationLog} stretchLog={stretchLog}/>}
        </Section>

        <Section title="루틴" badge={`${doneRt}/${todayRt.length}`} badgeColor="#4a90d9" action={<SmBtn onClick={()=>setShowRM(true)}>+ 추가</SmBtn>}>
          {todayRt.length>0&&<ProgressBar pct={rtPct} color="#4a90d9"/>}
          {todayRt.length===0&&<Empty>루틴을 추가해 보세요</Empty>}
          {todayRt.map(r=>{
            const done=r.doneDate===today;
            return(
              <div key={r.id} onClick={()=>toggleRt(r.id)}
                style={{display:"flex",alignItems:"center",gap:10,padding:"11px 12px",borderRadius:10,marginBottom:6,background:"var(--color-background-secondary)",cursor:"pointer",opacity:done?0.65:1,border:"0.5px solid var(--color-border-tertiary)",minHeight:48}}>
                <Check done={done} color="#48bb78" round/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:500,textDecoration:done?"line-through":"none",color:done?"var(--color-text-secondary)":"var(--color-text-primary)"}}>{r.title}</div>
                  <div style={{display:"flex",gap:6,marginTop:3,flexWrap:"wrap",alignItems:"center"}}>
                    <span style={{fontSize:11,color:"var(--color-text-secondary)"}}>{r.freq==="daily"?"매일":r.days?.map(d=>DOW[d]).join("·")}</span>
                    {r.time&&<span style={{fontSize:11,color:"var(--color-text-secondary)"}}>🕐{r.time}</span>}
                    <CatBadge catId={r.catId} categories={categories}/>
                  </div>
                </div>
                <div style={{width:8,height:8,borderRadius:"50%",background:r.color||"#4a90d9",flexShrink:0}}/>
              </div>
            );
          })}
        </Section>

        <Section title="일정 & 할일" badge={`${doneTodo}/${todayEv.length}`} badgeColor="#48bb78" action={<SmBtn onClick={()=>setShowEM(true)}>+ 추가</SmBtn>}>
          {todayEv.length===0&&<Empty>일정을 추가해 보세요</Empty>}
          {todayEv.map(ev=>(
            <div key={ev.id} onClick={()=>toggleEv(ev.id)}
              style={{display:"flex",alignItems:"flex-start",gap:10,padding:"11px 12px",borderRadius:10,marginBottom:6,background:"var(--color-background-secondary)",cursor:"pointer",border:"0.5px solid var(--color-border-tertiary)",borderLeft:`3px solid ${ev.color||"#4a90d9"}`,minHeight:48}}>
              <Check done={ev.done} color="#48bb78" round={false} style={{marginTop:2}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:500,textDecoration:ev.done?"line-through":"none",color:ev.done?"var(--color-text-secondary)":"var(--color-text-primary)"}}>{ev.title}</div>
                <div style={{display:"flex",gap:6,marginTop:3,flexWrap:"wrap"}}>
                  {ev.time&&<span style={{fontSize:11,color:"var(--color-text-secondary)"}}>🕐{ev.time}</span>}
                  <CatBadge catId={ev.catId} categories={categories}/>
                </div>
                {ev.note&&<div style={{fontSize:12,color:"var(--color-text-secondary)",marginTop:3}}>{ev.note}</div>}
              </div>
            </div>
          ))}
        </Section>
      </div>

      {showRM&&<RoutineModal onSave={r=>{setRoutines(p=>[...p,{...r,id:Date.now(),doneDate:null}]);setShowRM(false);}} onClose={()=>setShowRM(false)} categories={categories}/>}
      {showEM&&<EventModal ev={{date:today,title:"",time:"",color:"#4a90d9",note:"",done:false}} goals={[]} categories={categories} onSave={e=>{setEvents(p=>[...p,...(Array.isArray(e)?e:[{...e,id:Date.now()}])]);setShowEM(false);}} onClose={()=>setShowEM(false)}/>}
      {showCM&&<CategoryModal categories={categories} setCategories={setCategories} onClose={()=>setShowCM(false)}/>}
      {showBackup&&<BackupModal onClose={()=>setShowBackup(false)} setLastBackup={setLastBackup}/>}
      {showSearch&&<SearchModal events={events} goals={goals} habits={habits} journals={journals} categories={categories} onClose={()=>setShowSearch(false)}/>}
    </div>
  );
}

const BACKUP_KEYS=["v4_goals","v4_events","v4_routines","v4_habits","v4_hlogs","v4_cats","v4_mindmaps","v4_mandalas","v4_journals","v4_meditation_log","v4_stretch_log"];

function BackupModal({onClose,setLastBackup}){
  const fileRef=useRef(null);
  const [msg,setMsg]=useState("");
  const doExport=()=>{
    const data={};
    BACKUP_KEYS.forEach(k=>{try{data[k]=JSON.parse(localStorage.getItem(k));}catch{data[k]=null;}});
    data._exportedAt=new Date().toISOString();
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`routine-planner-backup-${todayStr()}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setLastBackup(new Date().toISOString());
    setMsg("✅ 내보내기 완료! 다운로드 폴더를 확인하세요.");
  };
  const doImport=e=>{
    const file=e.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        let count=0;
        BACKUP_KEYS.forEach(k=>{
          if(data[k]!==undefined&&data[k]!==null){localStorage.setItem(k,JSON.stringify(data[k]));count++;}
        });
        if(count===0){setMsg("⚠️ 올바른 백업 파일이 아닌 것 같아요.");return;}
        setMsg("✅ 가져오기 완료! 잠시 후 새로고침됩니다...");
        setTimeout(()=>window.location.reload(),1200);
      }catch{
        setMsg("⚠️ 파일을 읽을 수 없습니다. 백업 파일이 맞는지 확인해주세요.");
      }
    };
    reader.readAsText(file);
  };
  return(
    <Overlay onClose={onClose}>
      <ModalTitle>💾 데이터 백업</ModalTitle>
      <div style={{fontSize:13,color:"var(--color-text-secondary)",marginBottom:14,lineHeight:1.7}}>
        휴대폰을 바꾸거나 브라우저 데이터가 삭제되면 기록이 사라질 수 있어요.<br/>
        주기적으로 내보내기 해서 파일로 보관해두는 걸 추천드려요.
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <SmBtn onClick={doExport}>⬇️ 내 데이터 내보내기 (JSON 파일)</SmBtn>
        <input ref={fileRef} type="file" accept="application/json" onChange={doImport} style={{display:"none"}}/>
        <button onClick={()=>fileRef.current?.click()} style={{width:"100%",minHeight:44,padding:"9px 12px",borderRadius:8,border:"2px solid #cbd5e0",background:"#fff",color:"#4a5568",cursor:"pointer",fontSize:13,fontWeight:500}}>⬆️ 백업 파일 가져오기</button>
      </div>
      {msg&&<div style={{marginTop:10,fontSize:13,color:msg.startsWith("⚠️")?"#e53e3e":"#38a169"}}>{msg}</div>}
      <div style={{marginTop:14,paddingTop:12,borderTop:"1px solid var(--color-border-tertiary)",display:"flex",justifyContent:"flex-end"}}>
        <button onClick={onClose} style={{minHeight:40,padding:"7px 14px",borderRadius:8,border:"2px solid #cbd5e0",background:"#fff",color:"#4a5568",cursor:"pointer",fontSize:13}}>닫기</button>
      </div>
    </Overlay>
  );
}

function last7Dates(){return Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return fmt(d);});}

function WeeklyReview({habits,habitLogs,goals,meditationLog,stretchLog}){
  const days=last7Dates();
  const habitTotal=habits.length*7;
  const habitDone=habits.reduce((s,h)=>s+days.filter(d=>habitLogs[`${h.id}_${d}`]).length,0);
  const habitPct=habitTotal?Math.round(habitDone/habitTotal*100):0;
  const goalAvg=goals.length?Math.round(goals.reduce((s,g)=>s+(g.manualPct||0),0)/goals.length):0;
  const medMin=days.reduce((s,d)=>s+(meditationLog[d]||0),0);
  const stretchDone=days.reduce((s,d)=>s+STRETCHES.filter(x=>stretchLog[`${x.id}_${d}`]).length,0);
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
      <div style={{background:"var(--color-background-secondary)",borderRadius:12,padding:"12px",border:"0.5px solid var(--color-border-tertiary)"}}>
        <div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:4}}>습관 달성률</div>
        <div style={{fontSize:20,fontWeight:700,color:"#9f7aea"}}>{habitPct}%</div>
      </div>
      <div style={{background:"var(--color-background-secondary)",borderRadius:12,padding:"12px",border:"0.5px solid var(--color-border-tertiary)"}}>
        <div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:4}}>목표 평균 진행률</div>
        <div style={{fontSize:20,fontWeight:700,color:"#4a90d9"}}>{goalAvg}%</div>
      </div>
      <div style={{background:"var(--color-background-secondary)",borderRadius:12,padding:"12px",border:"0.5px solid var(--color-border-tertiary)"}}>
        <div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:4}}>명상 누적</div>
        <div style={{fontSize:20,fontWeight:700,color:"#9f7aea"}}>{medMin}분</div>
      </div>
      <div style={{background:"var(--color-background-secondary)",borderRadius:12,padding:"12px",border:"0.5px solid var(--color-border-tertiary)"}}>
        <div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:4}}>체조 완료</div>
        <div style={{fontSize:20,fontWeight:700,color:"#48bb78"}}>{stretchDone}회</div>
      </div>
    </div>
  );
}

function CalendarTab({events,setEvents,goals,categories}){
  const [calView,setCalView]=useState("month");
  const [curDate,setCurDate]=useState(new Date());
  const [modal,setModal]=useState(null);
  const [detailEv,setDetailEv]=useState(null);
  const [filterCat,setFilterCat]=useState(null);

  const nav=dir=>setCurDate(d=>{
    const n=new Date(d);
    if(calView==="month")n.setMonth(n.getMonth()+dir);
    else if(calView==="week")n.setDate(n.getDate()+dir*7);
    else n.setDate(n.getDate()+dir);
    return n;
  });
  const label=()=>{
    if(calView==="month")return`${curDate.getFullYear()}년 ${curDate.getMonth()+1}월`;
    if(calView==="week"){const ws=new Date(curDate);ws.setDate(ws.getDate()-ws.getDay());const we=new Date(ws);we.setDate(we.getDate()+6);return`${ws.getMonth()+1}/${ws.getDate()} ~ ${we.getMonth()+1}/${we.getDate()}`;}
    return`${curDate.getFullYear()}년 ${curDate.getMonth()+1}월 ${curDate.getDate()}일`;
  };
  const filtEvs=d=>events.filter(e=>e.date===fmt(d)&&(!filterCat||e.catId===filterCat));
  const saveEv=ev=>{
    if(Array.isArray(ev)){setEvents(p=>[...p,...ev]);}
    else if(ev.id&&events.find(e=>e.id===ev.id)){setEvents(p=>p.map(e=>e.id===ev.id?ev:e));}
    else{setEvents(p=>[...p,{...ev,id:Date.now()}]);}
    setModal(null);setDetailEv(null);
  };
  const delEv=id=>{setEvents(p=>p.filter(e=>e.id!==id));setDetailEv(null);};

  return(
    <div style={{padding:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:6}}>
        <div style={{display:"flex",gap:4}}>
          {["month","week","day","hour"].map(v=>(
            <button key={v} onClick={()=>{setCalView(v);setCurDate(new Date());}}
              style={{minHeight:36,padding:"6px 12px",borderRadius:8,border:calView===v?"none":"1px solid var(--color-border-tertiary)",background:calView===v?"#4a90d9":"var(--color-background-primary)",color:calView===v?"#fff":"var(--color-text-primary)",cursor:"pointer",fontSize:13}}>
              {v==="month"?"월":v==="week"?"주":v==="day"?"일":"시간"}
            </button>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <button onClick={()=>nav(-1)} style={navS}>‹</button>
          <span style={{fontSize:14,fontWeight:500,minWidth:120,textAlign:"center"}}>{label()}</span>
          <button onClick={()=>nav(1)} style={navS}>›</button>
          <button onClick={()=>setCurDate(new Date())} style={{...navS,fontSize:12}}>오늘</button>
        </div>
        <SmBtn onClick={()=>setModal({date:fmt(curDate),title:"",time:"",color:"#4a90d9",note:"",done:false})}>+ 일정 추가</SmBtn>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
        <button onClick={()=>setFilterCat(null)} style={{...chip(filterCat===null,"#4a90d9")}}>전체</button>
        {categories.map(c=><button key={c.id} onClick={()=>setFilterCat(filterCat===c.id?null:c.id)} style={{...chip(filterCat===c.id,c.color)}}>{c.name}</button>)}
      </div>
      <div style={{background:"var(--color-background-primary)",border:"1px solid var(--color-border-tertiary)",borderRadius:12,overflow:"hidden"}}>
        {calView==="month"&&<MonthView curDate={curDate} today={new Date()} dayEvs={filtEvs} onDay={d=>setModal({date:fmt(d),title:"",time:"",color:"#4a90d9",note:"",done:false})} onEv={setDetailEv}/>}
        {calView==="week"&&<WeekView curDate={curDate} today={new Date()} dayEvs={filtEvs} onDay={d=>setModal({date:fmt(d),title:"",time:"",color:"#4a90d9",note:"",done:false})} onEv={setDetailEv}/>}
        {calView==="day"&&<DayView curDate={curDate} dayEvs={filtEvs} onEv={setDetailEv} onAdd={()=>setModal({date:fmt(curDate),title:"",time:"",color:"#4a90d9",note:"",done:false})}/>}
        {calView==="hour"&&<HourView curDate={curDate} dayEvs={filtEvs} onEv={setDetailEv} onAdd={h=>setModal({date:fmt(curDate),title:"",time:`${String(h).padStart(2,"0")}:00`,color:"#4a90d9",note:"",done:false})}/>}
      </div>
      {modal&&<EventModal ev={modal} goals={goals} categories={categories} onSave={saveEv} onClose={()=>setModal(null)}/>}
      {detailEv&&<EventDetailModal ev={detailEv} goals={goals} categories={categories} onSave={saveEv} onDelete={()=>delEv(detailEv.id)} onClose={()=>setDetailEv(null)}/>}
    </div>
  );
}

function MonthView({curDate,today,dayEvs,onDay,onEv}){
  const y=curDate.getFullYear(),m=curDate.getMonth();
  const days=daysInMonth(y,m+1),first=new Date(y,m,1).getDay();
  const cells=[...Array(first).fill(null),...Array.from({length:days},(_,i)=>new Date(y,m,i+1))];
  const weeks=[];for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",borderBottom:"1px solid var(--color-border-tertiary)"}}>
        {DOW.map(d=><div key={d} style={{padding:"6px 0",textAlign:"center",fontSize:12,color:"var(--color-text-secondary)"}}>{d}</div>)}
      </div>
      {weeks.map((wk,wi)=>(
        <div key={wi} style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)"}}>
          {wk.map((d,di)=>{
            const evs=d?dayEvs(d):[];
            const isToday=d&&isSameDay(d,today);
            return(
              <div key={di} onClick={()=>d&&onDay(d)}
                style={{minHeight:76,borderRight:"0.5px solid var(--color-border-tertiary)",borderBottom:"0.5px solid var(--color-border-tertiary)",padding:"3px",cursor:d?"pointer":"default",background:isToday?"#ebf8ff":"transparent"}}>
                {d&&<div style={{fontSize:12,fontWeight:isToday?700:400,color:isToday?"#2b6cb0":"var(--color-text-primary)",width:22,height:22,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:isToday?"#bee3f8":"transparent",marginBottom:2}}>{d.getDate()}</div>}
                {evs.slice(0,2).map(ev=>(
                  <div key={ev.id} onClick={e=>{e.stopPropagation();onEv(ev);}}
                    style={{fontSize:10,padding:"2px 3px",borderRadius:3,marginBottom:1,background:(ev.color||"#4a90d9")+"22",borderLeft:`2px solid ${ev.color||"#4a90d9"}`,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",cursor:"pointer"}}>
                    {ev.title}
                  </div>
                ))}
                {evs.length>2&&<div style={{fontSize:10,color:"var(--color-text-secondary)"}}>+{evs.length-2}</div>}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function WeekView({curDate,today,dayEvs,onDay,onEv}){
  const ws=new Date(curDate);ws.setDate(ws.getDate()-ws.getDay());
  const days=Array.from({length:7},(_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d;});
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)"}}>
      {days.map((d,i)=>{
        const evs=dayEvs(d),isToday=isSameDay(d,today);
        return(
          <div key={i} style={{borderRight:"0.5px solid var(--color-border-tertiary)",minHeight:160}}>
            <div onClick={()=>onDay(d)} style={{padding:"6px 3px",textAlign:"center",borderBottom:"1px solid var(--color-border-tertiary)",cursor:"pointer",background:isToday?"#ebf8ff":"transparent"}}>
              <div style={{fontSize:11,color:"var(--color-text-secondary)"}}>{DOW[i]}</div>
              <div style={{fontSize:17,fontWeight:isToday?700:400,color:isToday?"#2b6cb0":"var(--color-text-primary)"}}>{d.getDate()}</div>
            </div>
            <div style={{padding:2}}>
              {evs.map(ev=>(
                <div key={ev.id} onClick={()=>onEv(ev)} style={{fontSize:10,padding:"2px 3px",borderRadius:3,marginBottom:2,background:(ev.color||"#4a90d9")+"22",borderLeft:`2px solid ${ev.color||"#4a90d9"}`,cursor:"pointer",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{ev.title}</div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function DayView({curDate,dayEvs,onEv,onAdd}){
  const evs=dayEvs(curDate).sort((a,b)=>(a.time||"").localeCompare(b.time||""));

          <div style={{minWidth:36,fontSize:12,color:"var(--color-text-secondary)",paddingTop:1}}>{ev.time||"--"}</div>

  );
}

function HourView({curDate,dayEvs,onEv,onAdd}){

function GoalsTab({goals,setGoals,events,categories}){
  const [modal,setModal]=useState(null);
  const [filterCat,setFilterCat]=useState(null);
  const [expandedIds,setExpandedIds]=useState({});
  const [subInputId,setSubInputId]=useState(null);
  const [subText,setSubText]=useState("");
  const toggleExp=id=>setExpandedIds(p=>({...p,[id]:!p[id]}));
  const calcPct=g=>{const rel=events.filter(e=>e.goalId===g.id);return rel.length?Math.round(rel.filter(e=>e.done).length/rel.length*100):g.manualPct||0;};
  const save=g=>{if(g.id&&goals.find(x=>x.id===g.id))setGoals(p=>p.map(x=>x.id===g.id?g:x));else setGoals(p=>[...p,{...g,id:Date.now()}]);setModal(null);};
  const del=id=>{setGoals(p=>p.filter(g=>g.id!==id));setModal(null);};
  const filtered=goals.filter(g=>!filterCat||g.catId===filterCat);
  return(
    <div style={{padding:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <span style={{fontSize:18,fontWeight:600}}>🎯 목표 관리</span>
        <SmBtn onClick={()=>setModal({isNew:true,title:"",color:COLORS[goals.length%COLORS.length],deadline:"",desc:""})}>+ 목표 추가</SmBtn>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
        <button onClick={()=>setFilterCat(null)} style={{...chip(filterCat===null,"#4a90d9")}}>전체</button>
        {categories.map(c=><button key={c.id} onClick={()=>setFilterCat(filterCat===c.id?null:c.id)} style={{...chip(filterCat===c.id,c.color)}}>{c.name}</button>)}
      </div>
      {filtered.length===0&&<Empty>목표를 추가해 보세요</Empty>}
      {filtered.map(g=>{
        const pct=calcPct(g);
        const rel=events.filter(e=>e.goalId===g.id);
        const doneCnt=rel.filter(e=>e.done).length;
        const dday=g.deadline?Math.ceil((new Date(g.deadline)-new Date(todayStr()))/(1000*60*60*24)):null;
        const ddayStr=dday===null?null:dday===0?"D-Day":dday>0?`D-${dday}`:`D+${Math.abs(dday)}`;
        const ddayColor=dday===null?"#a0aec0":dday<0?"#a0aec0":dday<=3?"#f56565":dday<=7?"#ed8936":"#48bb78";
        const subs=g.subs||[];
        const recent=rel.filter(e=>e.done).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
        const expanded=!!expandedIds[g.id];
        return(
          <div key={g.id} style={{background:"var(--color-background-primary)",border:`2px solid ${g.color}`,borderRadius:14,padding:"14px 16px",marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3,flexWrap:"wrap"}}>
                  <span style={{fontWeight:600,fontSize:15}}>{g.title}</span>
                  <CatBadge catId={g.catId} categories={categories}/>
                  {ddayStr&&<span style={{fontSize:11,fontWeight:700,color:ddayColor,background:ddayColor+"18",padding:"2px 8px",borderRadius:20}}>{ddayStr}</span>}
                </div>
                {g.desc&&<div style={{fontSize:12,color:"var(--color-text-secondary)",marginBottom:2}}>{g.desc}</div>}
                {g.deadline&&<div style={{fontSize:11,color:"var(--color-text-secondary)"}}>📅 {g.deadline}까지</div>}
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,marginLeft:10}}>
                <span style={{fontSize:24,fontWeight:700,color:g.color,lineHeight:1}}>{pct}%</span>
                <button onClick={()=>setModal({...g,isNew:false})} style={{minHeight:32,fontSize:11,padding:"4px 10px",borderRadius:6,border:`1px solid ${g.color}`,background:"transparent",color:g.color,cursor:"pointer"}}>편집</button>
              </div>
            </div>
            <ProgressBar pct={pct} color={g.color}/>
            <div style={{display:"flex",gap:10,fontSize:12,color:"var(--color-text-secondary)",marginBottom:8,flexWrap:"wrap"}}>
              <span>📋 <b style={{color:"var(--color-text-primary)"}}>{rel.length}</b>개</span>
              <span>✅ <b style={{color:"#48bb78"}}>{doneCnt}</b>개 완료</span>
              <span>⏳ <b style={{color:"#ed8936"}}>{rel.length-doneCnt}</b>개 남음</span>
            </div>
            <button onClick={()=>toggleExp(g.id)} style={{minHeight:32,border:"none",background:"transparent",color:"var(--color-text-secondary)",cursor:"pointer",fontSize:12,padding:0}}>
              {expanded?"▲ 접기":"▼ 세부 보기"}
            </button>
            {expanded&&(
              <div style={{marginTop:10,borderTop:"1px solid var(--color-border-tertiary)",paddingTop:10}}>
                <div style={{marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                    <span style={{fontSize:12,fontWeight:600}}>세부 목표</span>
                    <button onClick={()=>{setSubInputId(g.id);setSubText("");}}
                      style={{minHeight:32,fontSize:11,padding:"4px 10px",borderRadius:6,border:`1px solid ${g.color}`,background:"transparent",color:g.color,cursor:"pointer"}}>+ 추가</button>
                  </div>
                  {subInputId===g.id&&(
                    <div style={{display:"flex",gap:6,marginBottom:8}}>
                      <TInput autoFocus value={subText} onChange={e=>setSubText(e.target.value)}
                        onKeyDown={e=>{if(e.key==="Enter"&&subText.trim()){setGoals(p=>p.map(x=>x.id===g.id?{...x,subs:[...(x.subs||[]),{id:Date.now(),text:subText.trim(),done:false}]}:x));setSubInputId(null);setSubText("");}}}
                        placeholder="세부 목표 입력" style={{flex:1,marginBottom:0}}/>
                      <SmBtn onClick={()=>{if(!subText.trim())return;setGoals(p=>p.map(x=>x.id===g.id?{...x,subs:[...(x.subs||[]),{id:Date.now(),text:subText.trim(),done:false}]}:x));setSubInputId(null);setSubText("");}}>추가</SmBtn>
                    </div>
                  )}
                  {subs.length===0&&<div style={{fontSize:12,color:"var(--color-text-secondary)"}}>세부 목표가 없어요</div>}
                  {subs.map(s=>(
                    <div key={s.id} style={{display:"flex",alignItems:"center",gap:7,marginBottom:6,minHeight:28}}>
                      <div onClick={()=>setGoals(p=>p.map(x=>x.id===g.id?{...x,subs:x.subs.map(sv=>sv.id===s.id?{...sv,done:!sv.done}:sv)}:x))}
                        style={{width:20,height:20,borderRadius:4,border:`2px solid ${s.done?g.color:"#cbd5e0"}`,background:s.done?g.color:"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:11,cursor:"pointer",flexShrink:0}}>
                        {s.done&&"✓"}
                      </div>
                      <span style={{fontSize:13,textDecoration:s.done?"line-through":"none",color:s.done?"var(--color-text-secondary)":"var(--color-text-primary)",flex:1}}>{s.text}</span>
                      <ConfirmX onConfirm={()=>setGoals(p=>p.map(x=>x.id===g.id?{...x,subs:x.subs.filter(sv=>sv.id!==s.id)}:x))} size={28}/>
                    </div>
                  ))}
                </div>
                <div>
                  <div style={{fontSize:12,fontWeight:600,marginBottom:5}}>최근 활동</div>
                  {recent.length===0&&<div style={{fontSize:12,color:"var(--color-text-secondary)"}}>완료된 일정이 없어요</div>}
                  {recent.map(ev=>(
                    <div key={ev.id} style={{display:"flex",gap:6,marginBottom:3,fontSize:12}}>
                      <span style={{color:"#48bb78"}}>✓</span>
                      <span style={{flex:1}}>{ev.title}</span>
                      <span style={{color:"var(--color-text-secondary)"}}>{ev.date}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      })}
      {modal&&<GoalModal goal={modal} categories={categories} onSave={save} onDelete={modal.isNew?null:()=>del(modal.id)} onClose={()=>setModal(null)}/>}
    </div>
  );
}

// 습관 탭
// ══════════════════════════════
function HabitsTab({habits,setHabits,habitLogs,setHabitLogs,categories}){
  const [modal,setModal]=useState(null);
  const [filterCat,setFilterCat]=useState(null);
  const today=todayStr();
  const toggle=(hid,ds)=>setHabitLogs(p=>({...p,[`${hid}_${ds}`]:!p[`${hid}_${ds}`]}));
  const last30=Array.from({length:30},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(29-i));return fmt(d);});
  const streak=hid=>{let s=0,d=new Date();while(habitLogs[`${hid}_${fmt(d)}`]){s++;d.setDate(d.getDate()-1);}return s;};
  const save=h=>{if(h.id&&habits.find(x=>x.id===h.id))setHabits(p=>p.map(x=>x.id===h.id?h:x));else setHabits(p=>[...p,{...h,id:Date.now()}]);setModal(null);};
  const del=id=>{setHabits(p=>p.filter(h=>h.id!==id));setModal(null);};
  const filtered=habits.filter(h=>!filterCat||h.catId===filterCat);
  return(
    <div style={{padding:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <span style={{fontSize:18,fontWeight:600}}>📊 습관 트래커</span>
        <SmBtn onClick={()=>setModal({isNew:true,title:"",color:COLORS[habits.length%COLORS.length],freq:"daily"})}>+ 습관 추가</SmBtn>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
        <button onClick={()=>setFilterCat(null)} style={{...chip(filterCat===null,"#4a90d9")}}>전체</button>
        {categories.map(c=><button key={c.id} onClick={()=>setFilterCat(filterCat===c.id?null:c.id)} style={{...chip(filterCat===c.id,c.color)}}>{c.name}</button>)}
      </div>
      {filtered.length===0&&<Empty>습관을 추가해 보세요</Empty>}
      {filtered.map(h=>{
        const done=habitLogs[`${h.id}_${today}`];
        const str=streak(h.id);
        const last7=last30.slice(-7).map(d=>({d,done:!!habitLogs[`${h.id}_${d}`]}));
        return(
          <div key={h.id} style={{background:"var(--color-background-primary)",border:"1px solid var(--color-border-tertiary)",borderRadius:14,padding:"12px 14px",marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",gap:9}}>
                <button onClick={()=>toggle(h.id,today)}
                  style={{width:32,height:32,borderRadius:"50%",border:`2px solid ${done?h.color:"#cbd5e0"}`,background:done?h.color:"transparent",color:"#fff",fontSize:14,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {done&&"✓"}
                </button>
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontWeight:500,fontSize:14,cursor:"pointer"}} onClick={()=>setModal({...h,isNew:false})}>{h.title}</span>
                    <CatBadge catId={h.catId} categories={categories}/>
                  </div>
                  <div style={{fontSize:11,color:"var(--color-text-secondary)"}}>🔥 {str}일 연속</div>
                </div>
              </div>
              <span style={{fontSize:11,color:"var(--color-text-secondary)"}}>{h.freq==="daily"?"매일":"매주"}</span>
            </div>
            <div style={{display:"flex",gap:3,marginBottom:6}}>
              {last7.map(({d,done})=>(
                <div key={d} onClick={()=>toggle(h.id,d)} title={d}
                  style={{flex:1,height:30,borderRadius:5,background:done?h.color:"#e2e8f0",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:done?"#fff":"var(--color-text-secondary)"}}>
                  {new Date(d).getDate()}
                </div>
              ))}
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:2}}>
              {last30.map(d=>(
                <div key={d} onClick={()=>toggle(h.id,d)} title={d}
                  style={{width:14,height:14,borderRadius:2,background:habitLogs[`${h.id}_${d}`]?h.color:"#e2e8f0",cursor:"pointer"}}/>
              ))}
            </div>
          </div>
        );
      })}
      {modal&&<HabitModal habit={modal} categories={categories} onSave={save} onDelete={modal.isNew?null:()=>del(modal.id)} onClose={()=>setModal(null)}/>}
    </div>
  );
}

// 생각정리 탭
// ══════════════════════════════
function ThinkTab({mindmaps,setMindmaps,mandalas,setMandalas,goals,setGoals}){
  const [mode,setMode]=useState("list");
  const [selMM,setSelMM]=useState(null);
  const [selMD,setSelMD]=useState(null);
  const [showNewMd,setShowNewMd]=useState(false);
  const [newMdTitle,setNewMdTitle]=useState("");
  const [showNewMm,setShowNewMm]=useState(false);
  const [newMmTitle,setNewMmTitle]=useState("");

  const createMandala=()=>{
    const title=newMdTitle.trim()||"새 만다라트";
    const cells=Array.from({length:81},()=>({text:""}));
    if(newMdTitle.trim())cells[40]={text:newMdTitle.trim()};
    const id=Date.now();
    setMandalas(p=>[...p,{id,title,cells}]);
    setSelMD(id);setMode("mandala");
    setShowNewMd(false);setNewMdTitle("");
  };
  const createMindmap=()=>{
    const title=newMmTitle.trim()||"새 마인드맵";
    const id=Date.now();
    setMindmaps(p=>[...p,{id,title,root:{id:1,text:newMmTitle.trim()||"중심 주제",children:[]}}]);
    setSelMM(id);setMode("mindmap");
    setShowNewMm(false);setNewMmTitle("");
  };

  if(mode==="mandala"&&selMD!==null){
    const md=mandalas.find(m=>m.id===selMD);
    return <MandalartEditor md={md} onSave={u=>{setMandalas(p=>p.map(m=>m.id===u.id?u:m));}} onBack={()=>{setMode("list");setSelMD(null);}} goals={goals} setGoals={setGoals}/>;
  }
  if(mode==="mindmap"&&selMM!==null){
    const mm=mindmaps.find(m=>m.id===selMM);
    return <MindmapEditor mm={mm} onSave={u=>{setMindmaps(p=>p.map(m=>m.id===u.id?u:m));}} onBack={()=>{setMode("list");setSelMM(null);}}/>;
  }

  return(
    <div style={{padding:16}}>
      <div style={{fontSize:18,fontWeight:600,marginBottom:14}}>✏️ 생각 정리</div>

      <Section title="🎯 만다라트" action={
        <SmBtn onClick={()=>setShowNewMd(v=>!v)}>{showNewMd?"취소":"+ 새로 만들기"}</SmBtn>
      }>
        {showNewMd&&(
          <div style={{display:"flex",gap:6,marginBottom:12}}>
            <TInput autoFocus value={newMdTitle} onChange={e=>setNewMdTitle(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&createMandala()}
              placeholder="핵심 목표 주제 입력 (예: 건강한 몸 만들기)" style={{flex:1,marginBottom:0}}/>
            <SmBtn onClick={createMandala}>만들기</SmBtn>
          </div>
        )}
        <div style={{background:"#faf5ff",border:"1px solid #e9d8fd",borderRadius:10,padding:"10px 13px",marginBottom:12,fontSize:13,color:"#553c9a",lineHeight:1.7}}>
          <b>📖 만다라트 사용법</b><br/>
          1. <b>중앙 셀</b>에 핵심 목표 입력<br/>
          2. 중앙 블록의 <b>주변 8칸</b>에 서브 목표 입력 → 각 방향 블록 중심에 <b>자동 복사</b><br/>
          3. 각 외곽 블록 나머지 8칸에 <b>실행 계획</b> 직접 입력
        </div>
        {mandalas.length===0&&<Empty>만다라트를 만들어 보세요</Empty>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {mandalas.map(md=>(
            <div key={md.id} style={{background:"var(--color-background-secondary)",borderRadius:10,padding:"12px 14px",border:"1px solid var(--color-border-tertiary)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div onClick={()=>{setSelMD(md.id);setMode("mandala");}} style={{cursor:"pointer",flex:1}}>
                  <div style={{fontWeight:500,fontSize:14,marginBottom:3}}>🎯 {md.title}</div>
                  <div style={{fontSize:12,color:"var(--color-text-secondary)"}}>작성 {md.cells.filter(c=>c.text).length}/81칸</div>
                </div>
                <ConfirmX onConfirm={()=>setMandalas(p=>p.filter(m=>m.id!==md.id))}/>
              </div>
            </div>
          ))}
        </div>
      </Section>

      <Section title="🧠 마인드맵" action={
        <SmBtn onClick={()=>setShowNewMm(v=>!v)}>{showNewMm?"취소":"+ 새로 만들기"}</SmBtn>
      }>
        {showNewMm&&(
          <div style={{display:"flex",gap:6,marginBottom:12}}>
            <TInput autoFocus value={newMmTitle} onChange={e=>setNewMmTitle(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&createMindmap()}
              placeholder="중심 주제 입력 (예: 이직 준비)" style={{flex:1,marginBottom:0}}/>
            <SmBtn onClick={createMindmap}>만들기</SmBtn>
          </div>
        )}
        <div style={{background:"#ebf8ff",border:"1px solid #bee3f8",borderRadius:10,padding:"10px 13px",marginBottom:12,fontSize:13,color:"#2b6cb0",lineHeight:1.7}}>
          <b>📖 마인드맵 사용법</b><br/>
          1. <b>+ 새로 만들기</b>로 마인드맵 생성<br/>
          2. 노드 텍스트를 <b>클릭</b>하면 편집 가능 (Enter로 저장)<br/>
          3. 노드 오른쪽 <b>+ 버튼</b>으로 하위 가지 추가<br/>
          4. <b>× 버튼</b>으로 해당 노드 삭제
        </div>
        {mindmaps.length===0&&<Empty>마인드맵을 만들어 보세요</Empty>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {mindmaps.map(mm=>(
            <div key={mm.id} style={{background:"var(--color-background-secondary)",borderRadius:10,padding:"12px 14px",border:"1px solid var(--color-border-tertiary)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div onClick={()=>{setSelMM(mm.id);setMode("mindmap");}} style={{cursor:"pointer",flex:1}}>
                  <div style={{fontWeight:500,fontSize:14,marginBottom:3}}>🧠 {mm.title}</div>
                  <div style={{fontSize:12,color:"var(--color-text-secondary)"}}>노드 {countNodes(mm.root)}개</div>
                </div>
                <ConfirmX onConfirm={()=>setMindmaps(p=>p.filter(m=>m.id!==mm.id))}/>
              </div>
            </div>
          ))}
        </div>
      </Section>
    </div>
  );
}

function MeTab({journals,setJournals,meditationLog,setMeditationLog,stretchLog,setStretchLog}){
  return(
    <div style={{padding:16}}>
      <div style={{fontSize:18,fontWeight:600,marginBottom:4}}>🧘 나를 위한 시간</div>
      <div style={{fontSize:13,color:"var(--color-text-secondary)",marginBottom:16,lineHeight:1.6}}>하루 중 잠깐, 일기·명상·체조로 나를 돌보는 시간이에요.</div>
      <JournalSection journals={journals} setJournals={setJournals}/>
      <MeditationSection meditationLog={meditationLog} setMeditationLog={setMeditationLog}/>

const MOODS=[{e:"😊",label:"좋음"},{e:"😐",label:"보통"},{e:"😢",label:"슬픔"},{e:"😡",label:"화남"},{e:"😴",label:"피곤"}];

function JournalSection({journals,setJournals}){
  const today=todayStr();
  const todayEntry=journals.find(j=>j.date===today);
  const [mood,setMood]=useState(todayEntry?.mood||null);
  const [text,setText]=useState(todayEntry?.text||"");
  const [showHistory,setShowHistory]=useState(false);
  const [saved,setSaved]=useState(false);

  const save=(m=mood,t=text)=>{
    if(!m&&!t.trim())return;
    setJournals(p=>{
      const exists=p.find(j=>j.date===today);
      if(exists)return p.map(j=>j.date===today?{...j,mood:m,text:t}:j);
      return [...p,{id:Date.now(),date:today,mood:m,text:t}];
    });
    setSaved(true);
    setTimeout(()=>setSaved(false),1500);
  };

  const past=journals.filter(j=>j.date!==today).sort((a,b)=>b.date.localeCompare(a.date));

  return(
    <Section title="📔 오늘의 일기" action={<SmBtn onClick={()=>setShowHistory(s=>!s)}>{showHistory?"닫기":`지난 기록 (${past.length})`}</SmBtn>}>
      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
        {MOODS.map(m=>(
          <button key={m.e} onClick={()=>{setMood(m.e);save(m.e,text);}} title={m.label}
            style={{minWidth:46,minHeight:46,borderRadius:12,border:`2px solid ${mood===m.e?"#4a90d9":"var(--color-border-tertiary)"}`,background:mood===m.e?"#4a90d918":"var(--color-background-secondary)",fontSize:21,cursor:"pointer"}}>{m.e}</button>
        ))}
      </div>
      <textarea value={text} onChange={e=>setText(e.target.value)} onBlur={()=>save(mood,text)}
        placeholder="오늘 하루는 어땠나요? 짧게 적어보세요." style={{...taS,minHeight:84}}/>
      <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",gap:8,marginTop:8}}>
        {saved&&<span style={{fontSize:12,color:"#48bb78"}}>✅ 저장됨</span>}
        <SmBtn onClick={()=>save(mood,text)}>저장</SmBtn>
      </div>
      {showHistory&&(
        <div style={{marginTop:12,borderTop:"1px solid var(--color-border-tertiary)",paddingTop:10}}>
          {past.length===0&&<Empty>지난 기록이 없어요</Empty>}
          {past.slice(0,14).map(j=>(
            <div key={j.id} style={{padding:"9px 11px",background:"var(--color-background-secondary)",borderRadius:8,marginBottom:6}}>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}>
                {j.mood&&<span style={{fontSize:17}}>{j.mood}</span>}
                <span style={{fontSize:12,color:"var(--color-text-secondary)"}}>{j.date}</span>
              </div>
              {j.text&&<div style={{fontSize:13,lineHeight:1.6}}>{j.text}</div>}
            </div>
          ))}
        </div>
      )}
    </Section>
  );
}

const MED_PRESETS=[1,5,10,20];

function MeditationSection({meditationLog,setMeditationLog}){
  const [duration,setDuration]=useState(5*60);
  const [remaining,setRemaining]=useState(5*60);
  const [running,setRunning]=useState(false);
  const today=todayStr();
  const todayMin=meditationLog[today]||0;

  useEffect(()=>{
    if(!running)return;
    if(remaining<=0){
      setRunning(false);
      setMeditationLog(p=>({...p,[today]:(p[today]||0)+Math.round(duration/60)}));
      return;
    }
    const t=setTimeout(()=>setRemaining(r=>r-1),1000);
    return ()=>clearTimeout(t);
  },[running,remaining]);

  const pick=min=>{setDuration(min*60);setRemaining(min*60);setRunning(false);};
  const mm=String(Math.floor(remaining/60)).padStart(2,"0");
  const ss=String(remaining%60).padStart(2,"0");
  const finished=remaining<=0;

  return(
    <Section title="🧘 명상 타이머" badge={todayMin?`오늘 ${todayMin}분`:undefined} badgeColor="#9f7aea">
      <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
        {MED_PRESETS.map(m=>(
          <button key={m} onClick={()=>pick(m)} style={{...chip(duration===m*60,"#9f7aea")}}>{m}분</button>
        ))}
      </div>
      <div style={{textAlign:"center",padding:"26px 0",background:"var(--color-background-secondary)",borderRadius:14,marginBottom:10,border:"1px solid var(--color-border-tertiary)"}}>
        <div style={{fontSize:46,fontWeight:700,fontVariantNumeric:"tabular-nums",color:"var(--color-text-primary)"}}>{mm}:{ss}</div>
      </div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setRunning(r=>!r)} disabled={finished}
          style={{flex:1,minHeight:46,borderRadius:10,border:"none",background:finished?"#cbd5e0":"#9f7aea",color:"#fff",fontSize:14,fontWeight:600,cursor:finished?"default":"pointer"}}>{running?"일시정지":"시작"}</button>
        <button onClick={()=>{setRunning(false);setRemaining(duration);}}
          style={{minHeight:46,padding:"0 18px",borderRadius:10,border:"2px solid var(--color-border-tertiary)",background:"transparent",color:"var(--color-text-primary)",fontSize:14,cursor:"pointer"}}>초기화</button>
      </div>
      {finished&&<div style={{marginTop:10,fontSize:13,color:"#48bb78",fontWeight:600}}>✅ 오늘의 명상을 마쳤어요</div>}
    </Section>
  );
}

function StretchSection({stretchLog,setStretchLog}){
  const today=todayStr();

  const toggle=id=>setStretchLog(p=>({...p,[`${id}_${today}`]:!p[`${id}_${today}`]}));
  return(
    <Section title="🤸 가벼운 체조" badge={`${todayDone}/${STRETCHES.length}`} badgeColor="#48bb78">

function countNodes(node){return 1+(node.children||[]).reduce((s,c)=>s+countNodes(c),0);}

function MindmapEditor({mm,onSave,onBack}){
  const [root,setRoot]=useState(mm.root);
  const [title,setTitle]=useState(mm.title);
  const [editing,setEditing]=useState(null);
  const [editText,setEditText]=useState("");
  const BC=["#4a90d9","#48bb78","#ed8936","#9f7aea","#f56565","#38b2ac","#ed64a6","#667eea"];

  const addChild=pid=>{
    const nn={id:Date.now(),text:"새 항목",children:[]};
    const add=n=>n.id===pid?{...n,children:[...n.children,nn]}:{...n,children:n.children.map(add)};
    const nr=add(root);setRoot(nr);onSave({...mm,title,root:nr});setEditing(nn.id);setEditText("새 항목");
  };
  const updText=(nid,text)=>{
    const upd=n=>n.id===nid?{...n,text}:{...n,children:n.children.map(upd)};
    const nr=upd(root);setRoot(nr);onSave({...mm,title,root:nr});
  };
  const delNode=nid=>{
    const del=n=>({...n,children:n.children.filter(c=>c.id!==nid).map(del)});
    const nr=del(root);setRoot(nr);onSave({...mm,title,root:nr});
  };
  const renderNode=(node,depth=0,bi=0)=>{
    const color=depth===0?"#2d3748":BC[bi%BC.length];
    const isEdit=editing===node.id;
    return(
      <div key={node.id} style={{marginLeft:depth>0?20:0,marginBottom:5}}>
        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          {depth>0&&<div style={{width:16,height:2,background:color,flexShrink:0}}/>}
          <div style={{display:"flex",alignItems:"center",gap:4,background:depth===0?"#4a90d9":color+"1a",border:`2px solid ${color}`,borderRadius:20,padding:"6px 10px"}}>
            {isEdit?(
              <input autoFocus value={editText} onChange={e=>setEditText(e.target.value)}
                onBlur={()=>{updText(node.id,editText);setEditing(null);}}
                onKeyDown={e=>{if(e.key==="Enter"){updText(node.id,editText);setEditing(null);}}}
                style={{border:"none",background:"transparent",color:depth===0?"#fff":color,fontWeight:depth===0?700:400,fontSize:depth===0?15:13,outline:"none",minWidth:60,width:Math.max(60,editText.length*8)}}/>
            ):(
              <span onClick={()=>{setEditing(node.id);setEditText(node.text);}} style={{color:depth===0?"#fff":color,fontWeight:depth===0?700:400,fontSize:depth===0?15:13,cursor:"text"}}>{node.text}</span>
            )}
            <button onClick={()=>addChild(node.id)} style={{minWidth:24,minHeight:24,border:"none",background:"transparent",color:depth===0?"rgba(255,255,255,0.8)":color,cursor:"pointer",fontSize:16,padding:"0 2px",lineHeight:1}}>+</button>
            {depth>0&&<ConfirmX onConfirm={()=>delNode(node.id)} size={24} fontSize={14}/>}
          </div>
        </div>
        {node.children.length>0&&(
          <div style={{marginLeft:depth===0?0:20,marginTop:4}}>
            {node.children.map((c,i)=>renderNode(c,depth+1,depth===0?i:bi))}
          </div>
        )}
      </div>
    );
  };
  return(
    <div style={{padding:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <button onClick={onBack} style={navS}>← 뒤로</button>
        <input value={title} onChange={e=>{setTitle(e.target.value);onSave({...mm,title:e.target.value,root});}}
          style={{flex:1,fontWeight:600,fontSize:16,border:"none",background:"transparent",color:"var(--color-text-primary)",outline:"none"}}/>
        <span style={{fontSize:12,color:"var(--color-text-secondary)"}}>자동 저장</span>
      </div>
      <div style={{background:"#eff7ff",border:"1px solid #bee3f8",borderRadius:10,padding:"8px 12px",marginBottom:12,fontSize:12,color:"#2b6cb0"}}>
        💡 노드 클릭 → 편집 | <b>+</b> → 하위 가지 추가 | <b>×</b> → 삭제 | Enter → 저장
      </div>
      <div style={{padding:14,background:"var(--color-background-secondary)",borderRadius:12,minHeight:300,overflowX:"auto",border:"1px solid var(--color-border-tertiary)"}}>
        <div style={{minWidth:280}}>{renderNode(root)}</div>
      </div>
    </div>
  );
}

const MD_CORE=40;
const MD_SUB_MAP={30:10,31:13,32:16,39:37,41:43,48:64,49:67,50:70};
const MD_SUB_IN=new Set([30,31,32,39,41,48,49,50]);
const MD_MIRRORS=new Set([10,13,16,37,43,64,67,70]);

function mdBlk(idx){return Math.floor(Math.floor(idx/9)/3)*3+Math.floor((idx%9)/3);}

const MD_PAL=[
  {bg:"#b2dfdb",ct:"#00897b",tx:"#004d40"},
  {bg:"#fff9c4",ct:"#f9a825",tx:"#795548"},
  {bg:"#c8e6c9",ct:"#2e7d32",tx:"#1b5e20"},
  {bg:"#f8bbd0",ct:"#c2185b",tx:"#880e4f"},
  {bg:"#e8eaf6",ct:"#5c6bc0",tx:"#283593"},
  {bg:"#fff3e0",ct:"#e65100",tx:"#bf360c"},
  {bg:"#e1bee7",ct:"#6a1b9a",tx:"#4a148c"},
  {bg:"#b3e5fc",ct:"#01579b",tx:"#01579b"},
  {bg:"#fce4ec",ct:"#880e4f",tx:"#880e4f"},
];

function MandalartEditor({md,onSave,onBack,goals,setGoals}){
  const [cells,setCells]=useState(()=>md.cells&&md.cells.length===81?md.cells:Array.from({length:81},()=>({text:""})));
  const [title,setTitle]=useState(md.title);
  const [editIdx,setEditIdx]=useState(null);
  const [editText,setEditText]=useState("");
  const [toast,setToast]=useState("");

  const persist=nc=>{setCells(nc);onSave({...md,title,cells:nc});};

  const commit=(idx,text)=>{
    let nc=cells.map((c,i)=>i===idx?{...c,text}:c);
    if(MD_SUB_MAP[idx]!==undefined){
      const mi=MD_SUB_MAP[idx];
      nc=nc.map((c,i)=>i===mi?{...c,text}:c);
    }
    persist(nc);
    setEditIdx(null);
  };

  const addGoal=(idx)=>{
    const t=cells[idx]?.text;if(!t)return;
    setGoals(p=>[...p,{id:Date.now(),title:t,color:COLORS[goals.length%COLORS.length],desc:"만다라트에서 생성",deadline:"",manualPct:0}]);
    setToast(`"${t}" 목표가 추가됐어요!`);
    setTimeout(()=>setToast(""),2500);
  };

  return(
    <div style={{padding:"14px 12px"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <button onClick={onBack} style={navS}>← 뒤로</button>
        <input value={title} onChange={e=>{setTitle(e.target.value);onSave({...md,title:e.target.value,cells});}}
          style={{flex:1,minWidth:90,fontWeight:700,fontSize:16,border:"none",background:"transparent",color:"var(--color-text-primary)",outline:"none"}}/>
        <span style={{fontSize:11,color:"#48bb78"}}>✅ 자동저장</span>
      </div>
      {toast&&<div style={{marginBottom:10,fontSize:12,fontWeight:600,color:"#2e7d32",background:"#e8f5e9",padding:"7px 12px",borderRadius:8}}>{toast}</div>}

      <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"9px 12px",marginBottom:10,fontSize:12,color:"#1e3a8a",lineHeight:1.8}}>
        <b>📖 작성 순서</b><br/>
        <b style={{color:"#3949ab"}}>1</b> 정중앙(진한 파랑) → <b>핵심목표</b> 입력<br/>
        <b style={{color:"#5c6bc0"}}>2</b> 중앙 블록 주변 8칸 → <b>서브목표</b> 입력 (→ 각 외곽블록 중심에 <b>자동복사</b>)<br/>
        <b style={{color:"#00897b"}}>3</b> 외곽 블록 나머지 64칸 → <b>실행계획</b> 입력
      </div>

      <div style={{overflowX:"auto"}}>
        <div style={{
          display:"grid",
          gridTemplateColumns:"repeat(9,1fr)",
          gridTemplateRows:"repeat(9,1fr)",
          width:"100%",maxWidth:640,aspectRatio:"1/1",
          margin:"0 auto",
          border:"2.5px solid rgba(0,0,0,0.5)",
          borderRadius:5,overflow:"hidden",
          boxShadow:"0 3px 14px rgba(0,0,0,0.12)",
        }}>
          {cells.map((cell,idx)=>{
            const row=Math.floor(idx/9),col=idx%9;
            const blk=mdBlk(idx);
            const pal=MD_PAL[blk];
            const isCore=idx===MD_CORE;
            const isSubIn=MD_SUB_IN.has(idx);
            const isMirror=MD_MIRRORS.has(idx);
            const isEdit=editIdx===idx&&!isMirror;

            let bg,tc,fw;
            if(isCore){bg="#3949ab";tc="#fff";fw=800;}
            else if(isSubIn){bg="#5c6bc0";tc="#fff";fw=700;}
            else if(isMirror){bg=pal.ct;tc="#fff";fw=700;}
            else{bg=pal.bg;tc=pal.tx;fw=400;}

            const bR=(col===2||col===5)?"2.5px solid rgba(0,0,0,0.45)":(col===8?"none":"0.5px solid rgba(0,0,0,0.12)");
            const bB=(row===2||row===5)?"2.5px solid rgba(0,0,0,0.45)":(row===8?"none":"0.5px solid rgba(0,0,0,0.12)");

            return(
              <div key={idx}
                onClick={()=>{if(isMirror||isEdit)return;setEditIdx(idx);setEditText(cell.text||"");}}
                style={{
                  background:bg,
                  borderRight:bR,borderBottom:bB,borderLeft:"none",borderTop:"none",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  cursor:isMirror?"default":"pointer",
                  position:"relative",overflow:"hidden",boxSizing:"border-box",
                  outline:isEdit?"2px solid #facc15":"none",outlineOffset:"-2px",
                }}>
                {isEdit?(
                  <textarea autoFocus value={editText}
                    onChange={e=>setEditText(e.target.value)}
                    onBlur={()=>commit(idx,editText)}
                    onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();commit(idx,editText);}}}
                    style={{width:"100%",height:"100%",border:"none",background:"rgba(255,255,255,0.22)",color:tc,fontSize:8,textAlign:"center",resize:"none",outline:"none",padding:1,boxSizing:"border-box",lineHeight:1.25,fontFamily:"inherit"}}/>
                ):(
                  <span style={{
                    fontSize:isCore?9:8,color:tc,textAlign:"center",
                    padding:"1px",lineHeight:1.25,wordBreak:"keep-all",
                    display:"block",width:"100%",fontWeight:fw,overflow:"hidden",
                  }}>{cell.text}</span>
                )}
                {(isCore||isSubIn||isMirror)&&cell.text&&!isEdit&&(
                  <button onClick={e=>{e.stopPropagation();addGoal(idx);}}
                    title="목표 탭에 추가"
                    style={{position:"absolute",top:0,right:0,border:"none",background:"rgba(0,0,0,0.22)",color:"#fff",fontSize:6,padding:"1px 2px",borderRadius:"0 0 0 3px",cursor:"pointer",lineHeight:1}}>🎯</button>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:5,fontSize:12}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{width:14,height:14,background:"#3949ab",borderRadius:3,flexShrink:0}}/>
          <span style={{color:"var(--color-text-secondary)"}}><b style={{color:"var(--color-text-primary)"}}>핵심목표</b> (1개) — 정중앙</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{width:14,height:14,background:"#5c6bc0",borderRadius:3,flexShrink:0}}/>
          <span style={{color:"var(--color-text-secondary)"}}><b style={{color:"var(--color-text-primary)"}}>서브목표 입력칸</b> (8개) — 중앙블록 주변</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{width:14,height:14,background:"#00897b",borderRadius:3,flexShrink:0}}/>
          <span style={{color:"var(--color-text-secondary)"}}><b style={{color:"var(--color-text-primary)"}}>자동복사</b> (8개) — 각 외곽블록 중심 (읽기전용)</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{width:14,height:14,background:"#b2dfdb",borderRadius:3,flexShrink:0,border:"1px solid #ccc"}}/>
          <span style={{color:"var(--color-text-secondary)"}}><b style={{color:"var(--color-text-primary)"}}>실행계획</b> (64개) — 외곽블록 나머지 칸</span>
        </div>
        <div style={{marginTop:4,color:"var(--color-text-secondary)",fontSize:11}}>
          💡 셀 클릭 → 입력 | Enter → 저장 | 🎯 버튼 → 목표 탭 연동
        </div>
      </div>
    </div>
  );
}

function EventModal({ev,goals,categories,onSave,onClose}){
  const [f,setF]=useState({...ev});
  const [repeat,setRepeat]=useState("none");
  const [repeatUntil,setRepeatUntil]=useState("");
  const s=(k,v)=>setF(p=>({...p,[k]:v}));
  const isNew=!f.id;

  const buildDates=()=>{
    if(repeat==="none"||!repeatUntil)return[f.date];
    const dates=[];
    let d=new Date(f.date);
    const end=new Date(repeatUntil);
    while(d<=end){
      dates.push(fmt(d));
      if(repeat==="daily")d.setDate(d.getDate()+1);
      else if(repeat==="weekly")d.setDate(d.getDate()+7);
      else if(repeat==="monthly")d.setMonth(d.getMonth()+1);
    }
    return dates.length?dates:[f.date];
  };

  const handleSave=()=>{
    if(isNew&&repeat!=="none"&&repeatUntil){
      const dates=buildDates();
      onSave(dates.map((d,i)=>({...f,date:d,id:Date.now()+i})));
    }else{
      onSave(f);
    }
  };

  return(
    <Overlay onClose={onClose}>
      <ModalTitle>{f.id?"일정 수정":"일정 추가"}</ModalTitle>
      <FRow><Label>제목</Label><TInput value={f.title} onChange={e=>s("title",e.target.value)} placeholder="일정 제목"/></FRow>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <FRow><Label>날짜</Label><TInput type="date" value={f.date} onChange={e=>s("date",e.target.value)}/></FRow>
        <FRow><Label>시간</Label><TInput type="time" value={f.time||""} onChange={e=>s("time",e.target.value)}/></FRow>
      </div>
      {isNew&&(
        <FRow>
          <Label>반복</Label>
          <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
            {[{v:"none",l:"없음"},{v:"daily",l:"매일"},{v:"weekly",l:"매주"},{v:"monthly",l:"매달"}].map(o=>(
              <button key={o.v} onClick={()=>setRepeat(o.v)} style={{minHeight:36,padding:"7px 13px",borderRadius:8,border:`2px solid ${repeat===o.v?"#4a90d9":"#cbd5e0"}`,background:repeat===o.v?"#4a90d9":"#fff",color:repeat===o.v?"#fff":"#4a5568",cursor:"pointer",fontSize:12,fontWeight:500}}>{o.l}</button>
            ))}
          </div>
          {repeat!=="none"&&<TInput type="date" value={repeatUntil} onChange={e=>setRepeatUntil(e.target.value)} placeholder="반복 종료일"/>}
        </FRow>
      )}
      <FRow>
        <Label>카테고리</Label>
        <TSel value={f.catId||""} onChange={e=>s("catId",Number(e.target.value)||null)}>
          <option value="">없음</option>
          {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </TSel>
      </FRow>
      <FRow>
        <Label>연결 목표</Label>
        <TSel value={f.goalId||""} onChange={e=>s("goalId",Number(e.target.value)||null)}>
          <option value="">없음</option>
          {goals.map(g=><option key={g.id} value={g.id}>{g.title}</option>)}
        </TSel>
      </FRow>
      <FRow><Label>색상</Label><ColorPicker value={f.color} onChange={c=>s("color",c)}/></FRow>
      <FRow><Label>메모</Label><textarea style={taS} value={f.note||""} onChange={e=>s("note",e.target.value)} placeholder="메모 (선택)"/></FRow>
      <MBtns onClose={onClose} onSave={handleSave} disabled={!f.title}/>
    </Overlay>
  );
}

function CategoryModal({categories,setCategories,onClose}){
  const [list,setList]=useState(categories);
  const [newName,setNewName]=useState("");
  const [newColor,setNewColor]=useState(COLORS[0]);
  const add=()=>{if(!newName.trim())return;setList(p=>[...p,{id:Date.now(),name:newName.trim(),color:newColor}]);setNewName("");};
  return(
    <Overlay onClose={onClose}>
      <ModalTitle>카테고리 관리</ModalTitle>
      <div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:10,lineHeight:1.5}}>카테고리를 삭제하면 이걸 쓰던 일정·루틴·목표·습관은 "카테고리 없음"으로 표시돼요.</div>
      {list.map(c=>(
        <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,padding:"8px",borderRadius:8,border:"1.5px solid #cbd5e0",minHeight:40}}>
          <div style={{width:14,height:14,borderRadius:"50%",background:c.color,flexShrink:0}}/>
          <span style={{flex:1,fontSize:14}}>{c.name}</span>
          <ConfirmX onConfirm={()=>setList(p=>p.filter(x=>x.id!==c.id))} size={28}/>
        </div>
      ))}
      <div style={{display:"flex",gap:6,marginTop:10,alignItems:"center",padding:"8px",borderRadius:8,border:"1.5px dashed #cbd5e0"}}>
        <TInput value={newName} onChange={e=>setNewName(e.target.value)} placeholder="새 카테고리 이름" onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:1,marginBottom:0}}/>
        <div style={{display:"flex",gap:3}}>
          {COLORS.slice(0,5).map(c=><div key={c} onClick={()=>setNewColor(c)} style={{width:22,height:22,borderRadius:"50%",background:c,cursor:"pointer",border:newColor===c?"2.5px solid #1a202c":"2px solid transparent"}}/>)}
        </div>
        <SmBtn onClick={add}>추가</SmBtn>

      <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:14}}>
        <button onClick={onClose} style={{minHeight:40,padding:"8px 14px",borderRadius:8,border:"2px solid #cbd5e0",background:"#fff",color:"#4a5568",cursor:"pointer",fontSize:13}}>취소</button>

// ══════════════════════════════
// 공통 컴포넌트
// ══════════════════════════════
function Overlay({children,onClose}){return(<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.72)",backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}><div onClick={e=>e.stopPropagation()} style={{background:"var(--color-background-primary)",borderRadius:18,padding:24,width:"min(420px,93vw)",maxHeight:"88vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,0.5)",position:"relative",color:"var(--color-text-primary)"}}>{children}</div></div>);}
function Section({title,badge,badgeColor,action,children}){return(<div style={{marginBottom:22}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div style={{display:"flex",alignItems:"center",gap:7}}><span style={{fontWeight:600,fontSize:15}}>{title}</span>{badge!==undefined&&<span style={{fontSize:11,fontWeight:700,padding:"2px 9px",borderRadius:20,background:(badgeColor||"#4a90d9")+"18",color:badgeColor||"#4a90d9"}}>{badge}</span>}</div>{action}</div>{children}</div>);}
function ProgressBar({pct,color}){return(<div style={{marginBottom:10}}><div style={{background:"#e2e8f0",borderRadius:20,height:11,overflow:"hidden",position:"relative"}}><div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:20,transition:"width 0.4s",display:"flex",alignItems:"center",justifyContent:"flex-end"}}>{pct>15&&<span style={{fontSize:9,color:"#fff",fontWeight:700,paddingRight:5}}>{pct}%</span>}</div></div></div>);}
function CatBadge({catId,categories}){const c=categories.find(x=>x.id===catId);if(!c)return null;return <span style={{fontSize:11,padding:"2px 7px",borderRadius:20,background:c.color+"22",color:c.color,fontWeight:600}}>{c.name}</span>;}
function Check({done,color,round,style}){return(<div style={{width:22,height:22,borderRadius:round?"50%":"5px",border:`2px solid ${done?color:"#cbd5e0"}`,background:done?color:"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:12,flexShrink:0,...style}}>{done&&"✓"}</div>);}
function Empty({children}){return <div style={{textAlign:"center",padding:"22px 0",color:"var(--color-text-secondary)",fontSize:13}}>{children}</div>;}
function SmBtn({onClick,children}){return <button onClick={onClick} style={{minHeight:36,padding:"7px 14px",borderRadius:8,border:"none",background:"#4a90d9",color:"#fff",cursor:"pointer",fontSize:13,fontWeight:500,whiteSpace:"nowrap"}}>{children}</button>;}
function ModalTitle({children}){return <div style={{fontWeight:700,fontSize:18,marginBottom:14,paddingBottom:10,borderBottom:"2px solid var(--color-border-tertiary)",color:"var(--color-text-primary)"}}>{children}</div>;}
function Label({children}){return <div style={{fontSize:13,color:"var(--color-text-secondary)",marginBottom:5,fontWeight:600}}>{children}</div>;}
function FRow({children}){return <div style={{marginBottom:12}}>{children}</div>;}
function TInput({style,...p}){return <input style={{width:"100%",minHeight:44,padding:"10px 12px",borderRadius:8,border:"2px solid #cbd5e0",background:"var(--color-background-primary)",color:"var(--color-text-primary)",fontSize:14,boxSizing:"border-box",outline:"none",transition:"border-color 0.2s",...style}} onFocus={e=>e.target.style.borderColor="#4a90d9"} onBlur={e=>e.target.style.borderColor="#cbd5e0"} {...p}/>;}
function TSel({children,...p}){return <select style={{width:"100%",minHeight:44,padding:"10px 12px",borderRadius:8,border:"2px solid #cbd5e0",background:"var(--color-background-primary)",color:"var(--color-text-primary)",fontSize:14,boxSizing:"border-box"}} {...p}>{children}</select>;}
function ColorPicker({value,onChange}){return(<div style={{display:"flex",gap:6,flexWrap:"wrap",padding:"8px",borderRadius:8,border:"2px solid #cbd5e0",background:"var(--color-background-secondary)"}}>{COLORS.map(c=><div key={c} onClick={()=>onChange(c)} style={{width:30,height:30,borderRadius:"50%",background:c,cursor:"pointer",border:value===c?"3px solid var(--color-text-primary)":"3px solid transparent"}}/>)}</div>);}
function MBtns({onClose,onSave,onDelete,disabled}){
  const [confirming,setConfirming]=useState(false);
  if(confirming){
    return(
      <div style={{marginTop:14,paddingTop:12,borderTop:"1px solid var(--color-border-tertiary)"}}>
        <div style={{fontSize:13,color:"#c53030",fontWeight:600,marginBottom:10}}>정말 삭제할까요? 되돌릴 수 없어요.</div>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button onClick={()=>setConfirming(false)} style={{minHeight:40,padding:"9px 15px",borderRadius:8,border:"2px solid #cbd5e0",background:"transparent",color:"#4a5568",cursor:"pointer",fontSize:13,fontWeight:500}}>아니오</button>
          <button onClick={onDelete} style={{minHeight:40,padding:"9px 15px",borderRadius:8,border:"none",background:"#fc8181",color:"#fff",cursor:"pointer",fontSize:13,fontWeight:600}}>예, 삭제할게요</button>
        </div>
      </div>
    );
  }
  return(<div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14,paddingTop:12,borderTop:"1px solid var(--color-border-tertiary)"}}>{onDelete&&<button onClick={()=>setConfirming(true)} style={{minHeight:40,padding:"9px 15px",borderRadius:8,border:"none",background:"#fc8181",color:"#fff",cursor:"pointer",fontSize:13,fontWeight:600}}>삭제</button>}<button onClick={onClose} style={{minHeight:40,padding:"9px 15px",borderRadius:8,border:"2px solid #cbd5e0",background:"transparent",color:"#4a5568",cursor:"pointer",fontSize:13,fontWeight:500}}>취소</button><button onClick={onSave} disabled={disabled} style={{minHeight:40,padding:"9px 20px",borderRadius:8,border:"none",background:disabled?"#cbd5e0":"#4a90d9",color:"#fff",cursor:disabled?"default":"pointer",fontSize:13,fontWeight:600}}>{disabled?"제목을 입력하세요":"저장"}</button></div>);
}
const taS={width:"100%",padding:"10px 12px",borderRadius:8,border:"2px solid #cbd5e0",background:"var(--color-background-primary)",color:"var(--color-text-primary)",fontSize:14,boxSizing:"border-box",resize:"vertical",minHeight:64,outline:"none"};
const navS={minHeight:36,padding:"6px 12px",borderRadius:8,border:"1px solid var(--color-border-tertiary)",background:"var(--color-background-primary)",color:"var(--color-text-primary)",cursor:"pointer",fontSize:14};
const chip=(active,color)=>({minHeight:34,padding:"6px 13px",borderRadius:20,border:`1.5px solid ${active?color:"var(--color-border-tertiary)"}`,background:active?color:"transparent",color:active?"#fff":"var(--color-text-secondary)",cursor:"pointer",fontSize:12,fontWeight:active?600:400});

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            if (confirm('새 버전이 있습니다. 지금 업데이트할까요?')) {
              nw.postMessage('SKIP_WAITING');
            }
          }
        });
      });
    }).catch(()=>{});
  });
}
</script>
